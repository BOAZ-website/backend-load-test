spring:

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    aws:
      s3:
        recruitment-bucket: ${S3_RECRUITMENT_BUCKET_NAME}
        archiving-bucket: ${S3_ARCHIVING_BUCKET_NAME}
      region:
        static: ap-northeast-2

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "https://api.bigdataboaz.com/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://api.bigdataboaz.com/login/oauth2/code/{registrationId}"
            scope:
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "https://api.bigdataboaz.com/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

swagger:
  server-url: "https://api.bigdataboaz.com"

cors:
  allowed-origins: "https://www.bigdataboaz.com,https://prod-www.bigdataboaz.com,https://dev.bigdataboaz.com,https://api.bigdataboaz.com,http://localhost:5173,http://localhost:5173/,http://localhost:5174,http://localhost:5174/,http://localhost:5174,http://localhost:8080"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000     # 15분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true

cookie:
  same-site: Strict
  secure: true
  domain: bigdataboaz.com

oauth2:
  redirect-uri: https://prod-www.bigdataboaz.com/auth/callback
  failure-redirect-uri: https://prod-www.bigdataboaz.com/login?error=true
  allowed-redirect-uris: "https://prod-www.bigdataboaz.com/auth/callback,https://www.bigdataboaz.com/auth/callback,https://dev.bigdataboaz.com/auth/callback"

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.boaz: INFO
  file:
    name: /var/log/boaz/application.log